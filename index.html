的世界。\",\"读李白，可以从一个仰望的瞬间开始：月色是可以对饮的，瀑布仿佛从银河落下，即使行路艰难，目光仍投向远处的海。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"701—762\",\"start\":701,\"end\":762,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"li-bai-bio\",\"li-bai-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":40,\"kind\":\"poet\",\"aliases\":[\"李白\",\"太白\",\"青莲居士\",\"青蓮居士\"],\"dynasty\":\"唐\",\"courtesyName\":\"太白\",\"artName\":\"青莲居士\",\"contribution\":\"以鲜明的想象、自由的节奏与富于变化的语言，拓展唐诗的抒情天地。\",\"epigraph\":{\"lines\":[\"长风破浪会有时，\",\"直挂云帆济沧海。\"],\"title\":\"行路难·其一\",\"sourceId\":\"li-bai-verse\"}},{\"id\":\"wang-wei\",\"slug\":\"wang-wei\",\"title\":\"王维\",\"summary\":\"在山水的留白里，听见自己的心。\",\"body\":[\"王维，字摩诘，唐代诗人、画家。诗与画在他的创作中彼此映照，山林、流水与空寂的时刻，成为独特的风景。\",\"不妨跟随他的脚步慢下来。走到水流尽处，便坐下看云：诗中的静并不是空无，而是细小的声音、光线与人的心绪。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约701—761\",\"start\":701,\"end\":761,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"disputed\",\"note\":\"生年存在异说；此处采用故宫博物院条目所列701年并以约年展示。\"},\"sourceIds\":[\"wang-wei-bio\",\"wang-wei-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":41,\"kind\":\"poet\",\"aliases\":[\"王维\",\"王維\",\"摩诘\",\"摩詰\",\"王右丞\"],\"dynasty\":\"唐\",\"courtesyName\":\"摩诘\",\"artName\":\"未详\",\"contribution\":\"将山水观照与细腻感受融入诗歌，也以绘画参与唐代艺术。\",\"epigraph\":{\"lines\":[\"行到水穷处，\",\"坐看云起时。\"],\"title\":\"终南别业\",\"sourceId\":\"wang-wei-verse\"}},{\"id\":\"du-fu\",\"slug\":\"du-fu\",\"title\":\"杜甫\",\"summary\":\"一纸诗行，安放山河与人间。\",\"body\":[\"杜甫，字子美，唐代诗人。他把个人的漂泊、日常的困顿与时代的变动写在一起，让宏阔的历史有了具体的人的声音。\",\"从望岳时的昂扬，到风雨中的牵挂，读杜甫，也是在读一个人如何不断把目光投向他人。沉郁的句子里，始终有温热的心。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"712—770\",\"start\":712,\"end\":770,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"du-fu-bio\",\"du-fu-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":42,\"kind\":\"poet\",\"aliases\":[\"杜甫\",\"子美\",\"少陵\",\"少陵野老\",\"杜工部\"],\"dynasty\":\"唐\",\"courtesyName\":\"子美\",\"artName\":\"未详\",\"contribution\":\"以深切的人间关怀与精密的诗歌语言，留下理解唐代社会与个人命运的重要作品。\",\"epigraph\":{\"lines\":[\"会当凌绝顶，\",\"一览众山小。\"],\"title\":\"望岳\",\"sourceId\":\"du-fu-verse\"}},{\"id\":\"su-shi\",\"slug\":\"su-shi\",\"title\":\"苏轼\",\"summary\":\"在仕途与山水之间，写下生活的辽阔。\",\"body\":[\"苏轼（1037—1101），字子瞻，号东坡居士，眉州眉山人。诗、词、散文与书画共同构成他的文学世界。\",\"黄州是理解苏轼的一处入口：贬谪带来生计与身份的变化，雨中的行路、江岸的怀古、寺院的月色，又成为可以反复阅读的文字。读作品时，也要保留史实与文学表达之间的距离。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1037—1101\",\"start\":1037,\"end\":1101,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"museum\",\"ding-source\"],\"assetIds\":[\"su-portrait\"],\"keywords\":[\"宋代\",\"黄州\",\"文人\"],\"order\":0,\"kind\":\"poet\",\"aliases\":[\"苏轼\",\"东坡\",\"苏东坡\",\"子瞻\",\"东坡居士\",\"蘇軾\"],\"dynasty\":\"北宋\",\"courtesyName\":\"子瞻\",\"artName\":\"东坡居士\",\"contribution\":\"以诗、词、散文拓展个人经验的表达，也以书画参与宋代文人艺术。\",\"epigraph\":{\"lines\":[\"竹杖芒鞋轻胜马，\",\"谁怕？一蓑烟雨任平生。\"],\"title\":\"定风波\",\"sourceId\":\"ding-source\"}},{\"id\":\"li-qing-zhao\",\"slug\":\"li-qing-zhao\",\"title\":\"李清照\",\"summary\":\"将细微的心事，酿成时间的回声。\",\"body\":[\"李清照，号易安居士，生活于两宋之际。她以词书写日常与身世，也参与金石收藏、整理和写作。\",\"从溪亭日暮的忘归，到后来的漂泊与追忆，同样细腻的感受，承载了不同的人生重量。读她的词，可以先留意一个动作、一缕香气或一阵风。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1084—约1155\",\"start\":1084,\"end\":1155,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"disputed\",\"note\":\"卒年未定，国家典籍博物馆作1155？；此处保留约年。\"},\"sourceIds\":[\"li-qing-zhao-bio\",\"li-qing-zhao-verse\"],\"assetIds\":[],\"keywords\":[\"宋词\",\"诗人志\"],\"order\":43,\"kind\":\"poet\",\"aliases\":[\"李清照\",\"易安\",\"易安居士\"],\"dynasty\":\"两宋\",\"courtesyName\":\"未详\",\"artName\":\"易安居士\",\"contribution\":\"以清新而精细的语言表达复杂情感，形成辨识鲜明的词风；另有《金石录后序》等文章传世。\",\"epigraph\":{\"lines\":[\"常记溪亭日暮，\",\"沉醉不知归路。\"],\"title\":\"如梦令\",\"sourceId\":\"li-qing-zhao-verse\"}},{\"id\":\"xin-qi-ji\",\"slug\":\"xin-qi-ji\",\"title\":\"辛弃疾\",\"summary\":\"灯火与剑气，都照见一颗赤子之心。\",\"body\":[\"辛弃疾，字幼安，号稼轩，南宋词人。他的词既有壮怀与忧思，也写田园生活和细腻的情感。\",\"走进他的文字，不必只寻找金戈铁马。元夕的灯火、村居的闲适与夜深的回望，呈现出同一个人丰富而有力的内心。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1140—1207\",\"start\":1140,\"end\":1207,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"xin-qi-ji-bio\",\"xin-qi-ji-verse\"],\"assetIds\":[],\"keywords\":[\"宋词\",\"诗人志\"],\"order\":44,\"kind\":\"poet\",\"aliases\":[\"辛弃疾\",\"辛棄疾\",\"幼安\",\"稼轩\",\"稼軒\"],\"dynasty\":\"南宋\",\"courtesyName\":\"幼安\",\"artName\":\"稼轩\",\"contribution\":\"拓展词的题材与表达方式，将历史感、个人志向和日常情境纳入词中。\",\"epigraph\":{\"lines\":[\"众里寻他千百度。\"],\"title\":\"青玉案·元夕\",\"sourceId\":\"xin-qi-ji-verse\"}}],\"sources\":[{\"id\":\"ding-source\",\"title\":\"《定风波·莫听穿林打叶声》\",\"author\":\"苏轼\",\"url\":\"https://zh.wikisource.org/w/index.php?title=定風波_(莫聽穿林打葉聲)\u0026oldid=8732900\",\"locator\":\"小序及词全文\",\"edition\":\"维基文库 oldid=8732900；转为简体，标点作阅读性调整\",\"rights\":\"古代作品原文公有领域；保留作者及版本入口。现代译释为本项目撰写。\",\"checkedOn\":\"2026-11-11\",\"notes\":\"小序载三月七日；页面系年1082。未将农历月日转换成公历月日。\"},{\"id\":\"li-bai-verse\",\"title\":\"行路难·其一\",\"author\":\"李白\",\"url\":\"https://zh.wikisource.org/wiki/行路難_(李白)\",\"locator\":\"所引诗句\",\"edition\":\"链接所示版本，2026-11-13 核对\",\"rights\":\"古典诗文原文为公有领域；现代资料仅作事实核对与来源链接。\",\"checkedOn\":\"2026-11-13\",\"notes\":\"仅摘录古典作品原文，转为简体；标点随展示调整，未复制现代译注。\"},{\"id\":\"wang-wei-verse\",\"title\":\"终南别业\",\"author\":\"王维\",\"url\":\"https://zh.wikisource.org/w/index.php?title=終南別業\u0026oldid=1982349\",\"locator\":\"所引诗句\",\"edition\":\"链接所示版本，2026-11-13 核对\",\"rights\":\"古典诗文原文为公有领域；现代资料仅作事实核对与来源链接。\",\"checkedOn\":\"2026-11-13\",\"notes\":\"仅摘录古典作品原文，转为简体；标点随展示调整，未复制现代译注。\"},{\"id\":\"du-fu-verse\",\"title\":\"望岳\",\"author\":\"杜甫\",\"url\":\"https://zh.wi
