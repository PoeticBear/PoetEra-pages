:\"岭南贬谪与晚年\",\"summary\":\"晚年再遭贬谪，远至惠州、儋州，遇赦北归后卒于常州。\",\"body\":[\"晚年再遭贬谪，远至惠州、儋州，遇赦北归后卒于常州。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1094—1101\",\"start\":1094,\"end\":1101,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"人生阶段为编辑划分，边界年允许与转折事件重合。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[],\"order\":5,\"kind\":\"stage\",\"poetId\":\"su-shi\"},{\"id\":\"exam\",\"slug\":\"exam\",\"title\":\"嘉祐二年进士及第\",\"summary\":\"苏轼应礼部试，文章得到欧阳修赏识。\",\"body\":[\"《宋史》记载欧阳修读到苏轼的《刑赏忠厚论》后深为赏识。1057年，苏轼进士及第，文学声名与仕途由此展开。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1057年\",\"start\":1057,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\"],\"order\":6,\"kind\":\"event\",\"stageId\":\"early\",\"background\":\"北宋科举为士人提供进入官僚系统的重要道路。\",\"impact\":\"科举经历将其文学写作与公共事务联系起来。\"},{\"id\":\"mizhou-service\",\"slug\":\"mizhou-service\",\"title\":\"由杭州移知密州\",\"summary\":\"从湖山之观到桑麻之野。\",\"body\":[\"苏轼在《超然台记》中自述由钱塘移守胶西，生活环境也随之改变。在密州，他写出出猎、登台与中秋怀人的作品。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1074—1076年，知密州\",\"start\":1074,\"end\":1076,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"按年表示，不推算具体公历月日。\"},\"sourceIds\":[\"chronology\",\"ink-chaoran-history\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"密州\"],\"order\":6,\"kind\":\"event\",\"stageId\":\"service\",\"background\":\"苏轼在《超然台记》中自述由钱塘移守胶西，生活环境也随之改变。在密州，他写出出猎、登台与中秋怀人的作品。\",\"impact\":\"从湖山之观到桑麻之野。\"},{\"id\":\"xuzhou-flood\",\"slug\":\"xuzhou-flood\",\"title\":\"徐州守城抗洪\",\"summary\":\"洪水逼近徐州，苏轼组织军民筑堤守城。\",\"body\":[\"《宋史》记苏轼劝阻富户弃城、动员武卫营与民众筑堤，并分派官吏守护。理解他的仕宦生涯，也要看到这些具体治理事务。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1077年\",\"start\":1077,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\"],\"order\":7,\"kind\":\"event\",\"stageId\":\"service\",\"background\":\"黄河决口带来的洪水威胁地方居民。\",\"impact\":\"守城经历呈现其作为地方官的责任。\"},{\"id\":\"wutai\",\"slug\":\"wutai\",\"title\":\"乌台诗案\",\"summary\":\"诗文被指为讥讪，苏轼被捕入御史台狱。\",\"body\":[\"御史从表文与诗作中搜摘语句，指控苏轼讥讪。他经历审讯后，被安排到黄州，以团练副使名义安置。此条是黄州生活的前情，不把入狱地点写作黄州。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1079年\",\"start\":1079,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":8,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"苏轼对新法的意见与北宋政治争论交织。\",\"impact\":\"这场政治风波改变了他的生活处境。\"},{\"id\":\"arrival\",\"slug\":\"arrival\",\"title\":\"抵达黄州\",\"summary\":\"离开台狱后，苏轼在黄州开始贬谪生活。\",\"body\":[\"年谱记1080年二月抵黄州，先居定惠院，后迁临皋。新的居住环境、经济压力与交游，共同构成这一时期的日常。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1080年（元丰三年）\",\"start\":1080,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"二月到达为农历记月；时间线仅使用公历年。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":9,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"黄州团练副使是贬谪安置身份，并不等于可以正常掌管当地军政。\",\"impact\":\"黄州成为此后数年生活与创作的中心。\"},{\"id\":\"dongpo\",\"slug\":\"dongpo\",\"title\":\"躬耕东坡\",\"summary\":\"在黄州耕作，自号“东坡居士”。\",\"body\":[\"《宋史》记筑室东坡并自号东坡居士。年谱把开始躬耕系于1081年；此处不补写未经核对的具体日期或劳动细节。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1081年\",\"start\":1081,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"躬耕系年参考年谱，具体起始日未定。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":10,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"贬谪生活需要应对生计，文人的身份也与田园劳作相遇。\",\"impact\":\"“东坡”逐渐成为苏轼最为人熟知的别号。\"},{\"id\":\"rain\",\"slug\":\"rain\",\"title\":\"沙湖道中遇雨\",\"summary\":\"一次遇雨，成为《定风波》的写作缘起。\",\"body\":[\"小序记三月七日沙湖道中遇雨，雨具先行，同行者狼狈，稍后天晴。这些可据文本说明；至于作者全部心理活动，不能由后人直接代言。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1082年，农历三月七日\",\"start\":1082,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"confirmed\",\"note\":\"年份据系年；月日为小序中的农历，不等同公历3月7日。\"},\"sourceIds\":[\"ding-source\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":11,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"词前小序为读者保留了行路遇雨的场景。\",\"impact\":\"词把行路中的风雨转化为对生活的文学思考。\"},{\"id\":\"red-cliff-writing\",\"slug\":\"red-cliff-writing\",\"title\":\"赤壁怀古与文学创作\",\"summary\":\"江岸的风景，引出对历史人物与自身处境的思考。\",\"body\":[\"年谱将《念奴娇·赤壁怀古》等赤壁作品系于1082年。词以江水、山石与周瑜形象组织怀古经验。黄州赤壁是文学触发点，不能由此证明它就是三国古战场。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1082年（黄州时期）\",\"start\":1082,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"采用通行系年；词正文不记精确写作月日。\"},\"sourceIds\":[\"nian-source\",\"chronology\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":12,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"苏轼谪居黄州，游览当地赤壁。\",\"impact\":\"作品让地方风景、历史想象与个人感受彼此映照。\"},{\"id\":\"night-walk\",\"slug\":\"night-walk\",\"title\":\"与张怀民夜游承天寺\",\"summary\":\"月色入户，苏轼起行，寻友共赏夜色。\",\"body\":[\"《记承天寺夜游》记元丰六年十月十二日夜，苏轼至承天寺寻张怀民。庭中的竹柏影被写作水中藻荇，末尾以“闲人”自况。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1083年，农历十月十二日夜\",\"start\":1083,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"confirmed\",\"note\":\"月日沿用作品所记农历，不换算公历。\"},\"sourceIds\":[\"night-source\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":13,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"苏轼仍在黄州，短文将一段夜间步行保留下来。\",\"impact\":\"日常片刻成为精短散文，既可读作审美体验，也保留了贬居者的处境。\"},{\"id\":\"departure\",\"slug\":\"departure\",\"title\":\"离开黄州\",\"summary\":\"被移往汝州安置，黄州生活告一段落。\",\"body\":[\"年谱记1084年四月别黄州，之后途经金陵与王安石相见。《宋史》也记移汝及途经金陵事，不应把离黄直接说成重返中央任职。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1084年\",\"start\":1084,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\"],\"order\":14,\"kind\":\"event\",\"stageId\":\"huangzhou\",\"background\":\"朝廷改变安置地点，并未立即使苏轼恢复正常任职。\",\"impact\":\"黄州经验继续影响他的写作；人生又进入流动之中。\"},{\"id\":\"court\",\"slug\":\"court\",\"title\":\"元祐年间再入朝廷\",\"summary\":\"任中书舍人、翰林学士，参与朝廷议政。\",\"body\":[\"《宋史》记元祐元年迁中书舍人，后为翰林学士。他对差役、免役的利弊提出意见，没有简单附和司马光。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1086年\",\"start\":1086,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\"],\"order\":15,\"kind\":\"event\",\"stageId\":\"return\",\"background\":\"哲宗即位后政治格局变化，苏轼被重新起用。\",\"impact\":\"仕途回升并未消除政见分歧，独立判断也带来新的处境。\"},{\"id\":\"south\",\"slug\":\"south\",\"title\":\"贬居惠州与儋州\",\"summary\":\"晚年先谪惠州，再渡海至儋州。\",\"body\":[\"苏轼1094年贬居惠州，1097年再被安置于海南儋州。这里按两次迁谪保留年份，不将岭南经历缩为一次旅行。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1094—1097年\",\"start\":1094,\"end\":1097,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\"],\"order\":16,\"kind\":\"event\",\"stageId\":\"late\",\"background\":\"绍圣年间政局再次改变，元祐官员遭到贬斥。\",\"impact\":\"这些晚年经历成为理解其文学与人生的重要背景。\"},{\"id\":\"ding-feng-bo\",\"slug\":\"ding-feng-bo\",\"title\":\"定风波·莫听穿林打叶声\",\"summary\":\"从一场春雨，读到面对风雨的步履。\",\"body\":[\"作于黄州时期。小序将缘起明确放在沙湖道中，词中的态度可以与贬谪背景对照阅读。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1082年，农历三月七日\",\"start\":1082,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"confirmed\",\"note\":\"月日据小序，年份采用通行系年；不转换为公历月日。\"},\"sourceIds\":[\"ding-source\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\",\"宋词\"],\"order\":17,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"huangzhou\",\"eventId\":\"rain\",\"genre\":\"词\",\"original\":[\"莫听穿林打叶声，何妨吟啸且徐行。\",\"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\",\"料峭春风吹酒醒，微冷，山头斜照却相迎。\",\"回首向来萧瑟处，归去，也无风雨也无晴。\"],\"preface\":\"三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此。\",\"editionNote\":\"全文及小序据维基文库 oldid=8732900。转为简体，“微冷”“归去”后分隔标点改用逗号，文字不改。\",\"annotations\":[{\"term\":\"吟啸\",\"meaning\":\"吟咏、长啸，这里写行路时从容自适的举动。\"},{\"term\":\"芒鞋\",\"meaning\":\"草鞋，与竹杖一起构成轻便行路的形象。\"},{\"term\":\"料峭\",\"meaning\":\"形容春风带来的微寒。\"},{\"term\":\"萧瑟\",\"meaning\":\"风雨吹打的声音，也能引出对境遇的联想。\"}],\"interpretation\":[\"不必只在意林叶间的雨声，也可以边吟咏边慢慢前行。竹杖草鞋在词人笔下轻快胜过骑马，一身烟雨也可以从容承受。\",\"春风微寒，使酒意渐醒；山头的斜阳又迎面照来。回望刚才的风雨处，词末把风雨与晴明一并放下。\"],\"appreciation\":[\"上片通过听觉与步态塑造从容，下片以寒意与斜阳写天气变化。结尾回望，使一次短途行路获得了更广的生活意味。\",\"“风雨”可以引发读者对政治遭遇的联想，但这种阐释不应取消小序记载的真实遇雨场景，也不能代替对作者心理的史料证明。\"],\"background\":\"作于黄州时期。小序将缘起明确放在沙湖道中，词中的态度可以与贬谪背景对照阅读。\"},{\"id\":\"nian-nu-jiao\",\"slug\":\"nian-nu-jiao\",\"title\":\"念奴娇·赤壁怀古\",\"summary\":\"江山、周郎与白发，在一首词里相遇。\",\"body\":[\"黄州时期的怀古词。与赤壁赋同属这一时期的文学创作，本期仅收录三篇作品，不用未收录的作品全文填充关联。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1082年，黄州时期\",\"start\":1082,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"系年据年谱；词正文没有精确日期，不把同年赤壁赋的纪日直接移用到本词。\"},\"sourceIds\":[\"nian-source\",\"chronology\",\"cliffs-source\",\"zhou-source\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\",\"宋词\"],\"order\":18,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"huangzhou\",\"eventId\":\"red-cliff-writing\",\"genre\":\"词\",\"original\":[\"大江东去，浪淘尽、千古风流人物。\",\"故垒西边，人道是、三国周郎赤壁。\",\"乱石穿空，惊涛拍岸，卷起千堆雪。\",\"江山如画，一时多少豪杰。\",\"遥想公瑾当年，小乔初嫁了，雄姿英发。\",\"羽扇纶巾，谈笑处、樯橹灰飞烟灭。\",\"故国神游，多情应笑我，早生华发。\",\"人间如梦，一尊还酹江月。\"],\"preface\":\"\",\"editionNote\":\"采用维基文库 oldid=10671217《御定词谱》一节全文，含“谈笑处”“人间如梦”。“谈笑间”“人生如梦”等见其他传本；此处不混合改写，标点沿所选版本。\",\"annotations\":[{\"term\":\"周郎 / 公瑾\",\"meaning\":\"均指周瑜；公瑾是他的字。这里是文学追怀，苏轼与周瑜并无实际交游。\"},{\"term\":\"人道是\",\"meaning\":\"人们说是。词自身保留了传说式的语气，不构成战场地点的考古证明。\"},{\"term\":\"纶巾\",\"meaning\":\"青丝带制成的头巾；与羽扇一起塑造人物的儒雅风度。\"},{\"term\":\"樯橹\",\"meaning\":\"桅杆与船桨，词中借指战船。\"},{\"term\":\"酹\",\"meaning\":\"把酒洒向地面或水面，表示祭奠。\"}],\"interpretation\":[\"江水向东流去，往昔人物似乎也随波消逝。人们说旧营垒西边就是周瑜破敌的赤壁；眼前的山石与江涛引出历史中的豪杰。\",\"想象中的周瑜英姿勃发，从容指挥水战。词人从历史想象回到自身的白发与多情，最后举酒面向江月。\"],\"appreciation\":[\"上片由江景展开时间的尺度，下片以周瑜形象与自我处境相照。读者能同时感到建功的向往、时间的流逝和文学想象的力量。\",\"“小乔初嫁”把人物青春凝缩进怀古画面，并非逐年逐日重述赤壁战史。词中的黄州赤壁与史书里的战争地点应分开理解。\"],\"background\":\"黄州时期的怀古词。与赤壁赋同属这一时期的文学创作，本期仅收录三篇作品，不用未收录的作品全文填充关联。\"},{\"id\":\"chengtian-night\",\"slug\":\"chengtian-night\",\"title\":\"记承天寺夜游\",\"summary\":\"一庭月色，两位闲人，一篇短而丰厚的散文。\",\"body\":[\"苏轼黄州贬居期间所记。正文直接提供了纪年、寺名与同行者，不据此推演张怀民的全部履历。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1083年，农历十月十二日夜\",\"start\":1083,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"confirmed\",\"note\":\"正文自记元丰六年。所列月日为农历，不等同公历10月12日。\"},\"sourceIds\":[\"night-source\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"黄州\",\"古文\"],\"order\":19,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"huangzhou\",\"eventId\":\"night-walk\",\"genre\":\"散文\",\"original\":[\"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。\",\"庭下如积水空明，水中藻荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。\"],\"preface\":\"\",\"editionNote\":\"正文据维基文库 oldid=8732064，采用“水中”（一作“水上”）。该页附“黄州团练副使苏某书。”题署，注明据《永乐大典》补；此处在正文后另列题署，保留补文性质。\",\"supplement\":\"补题署：黄州团练副使苏某书。（据《永乐大典》补，见版本说明。）\",\"annotations\":[{\"term\":\"念\",\"meaning\":\"想到、考虑。此处是想到没有可以共同赏乐的人。\"},{\"term\":\"相与\",\"meaning\":\"共同、一起。\"},{\"term\":\"藻荇\",\"meaning\":\"水生植物；这里借来形容月光中的竹柏影，并非说庭院真的积水。\"},{\"term\":\"闲人\",\"meaning\":\"能从日常中发现月色的人；联系贬谪背景，也可读出身处政务之外的复杂意味。这是阐释，不是作者完整自述。\"}],\"interpretation\":[\"夜间原本准备脱衣睡觉，月光照进门来，便高兴地起身。想到没有同乐的人，于是去承天寺找张怀民，两人一同在庭中散步。\",\"月光使庭院像澄明的积水，交错的竹柏影又像水草。月与竹柏处处可见，却少有像两人这样能够静心赏看的“闲人”。\"],\"appreciation\":[\"短文从起行、寻友到庭中赏月，叙事极简。“积水”与“藻荇”先制造视觉错觉，继而以“盖竹柏影也”点明。\",\"结尾从当夜推向普遍经验。“闲”既可以是审美的闲适，也允许联系被贬者的处境；两层阅读并存，不必把文字压成单一情绪。\"],\"background\":\"苏轼黄州贬居期间所记。正文直接提供了纪年、寺名与同行者，不据此推演张怀民的全部履历。\"},{\"id\":\"huangzhou-place\",\"slug\":\"huangzhou-place\",\"title\":\"黄州\",\"summary\":\"苏轼贬谪生活与文学创作的重要地点。\",\"body\":[\"北宋黄州是苏轼1080—1084年生活的中心。这里既有生计上的压力，也有与当地人和来访友人的交往。不要把团练副使的名义直接理解为掌理当地政务。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"北宋时期\",\"start\":960,\"end\":1127,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[],\"order\":20,\"kind\":\"place\",\"modernName\":\"今湖北黄冈一带\"},{\"id\":\"huangzhou-cliff\",\"slug\":\"huangzhou-cliff\",\"title\":\"黄州赤壁\",\"summary\":\"文学中的赤壁：黄州江岸的赤鼻矶。\",\"body\":[\"苏轼所游的黄州赤壁又称赤鼻矶，与三国战争的历史地理不能简单画等号。词中“人道是”提示的是一处被传说与文学联结的风景。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"时间未详\",\"precision\":\"unknown\",\"calendar\":\"gregorian\",\"certainty\":\"unknown\",\"note\":\"本条为知识说明，未设单一发生日期。\"},\"sourceIds\":[\"cliffs-source\",\"nian-source\"],\"assetIds\":[],\"keywords\":[\"赤鼻矶\",\"文赤壁\",\"赤壁\"],\"order\":21,\"kind\":\"place\",\"modernName\":\"今湖北黄冈东坡赤壁一带\"},{\"id\":\"chengtian-temple\",\"slug\":\"chengtian-temple\",\"title\":\"承天寺\",\"summary\":\"短文中的寻友与赏月之所。\",\"body\":[\"《记承天寺夜游》明确记载苏轼到承天寺寻张怀民，随后两人在中庭散步。作品提供的是北宋一次夜游的文本见证，不凭文字复原今天的全部寺院建筑。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"时间未详\",\"precision\":\"unknown\",\"calendar\":\"gregorian\",\"certainty\":\"unknown\",\"note\":\"本条为知识说明，未设单一发生日期。\"},\"sourceIds\":[\"night-source\"],\"assetIds\":[],\"keywords\":[],\"order\":22,\"kind\":\"place\",\"modernName\":\"历史上黄州的承天寺；今址沿革本期未作测绘确认\"},{\"id\":\"meishan\",\"slug\":\"meishan\",\"title\":\"眉山\",\"summary\":\"苏轼的故乡与家学起点。\",\"body\":[\"《宋史》称苏轼为眉州眉山人，记其母程氏亲授以书。这是他走向公共生活之前的家庭与地域背景。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"时间未详\",\"precision\":\"unknown\",\"calendar\":\"gregorian\",\"certainty\":\"unknown\",\"note\":\"本条为知识说明，未设单一发生日期。\"},\"sourceIds\":[\"songshi\",\"museum\"],\"assetIds\":[],\"keywords\":[],\"order\":23,\"kind\":\"place\",\"modernName\":\"今四川眉山\"},{\"id\":\"zhou-yu\",\"slug\":\"zhou-yu\",\"title\":\"周瑜\",\"summary\":\"字公瑾，苏轼词中追怀的历史人物。\",\"body\":[\"《三国志》周瑜传载其字公瑾，记他在建安十三年与曹军交战的经历。苏轼在《念奴娇》中追怀他的形象，属于跨时代的文学引用，不能连成现实交游关系。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"东汉末年\",\"precision\":\"unknown\",\"calendar\":\"gregorian\",\"certainty\":\"unknown\",\"note\":\"本期只标相关历史时期，不录未经本次核对的生卒月日。\"},\"sourceIds\":[\"zhou-source\",\"nian-source\"],\"assetIds\":[],\"keywords\":[\"周郎\",\"公瑾\",\"赤壁\"],\"order\":24,\"kind\":\"figure\"},{\"id\":\"zhang-huai-min\",\"slug\":\"zhang-huai-min\",\"title\":\"张怀民\",\"summary\":\"《记承天寺夜游》中与苏轼一同散步的人。\",\"body\":[\"正文记苏轼至承天寺寻张怀民，张怀民未寝，二人步于中庭。可据此确认这一次交游；本期不为其籍贯、官职与完整生平补造资料。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1083年见于夜游记述\",\"start\":1083,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"night-source\"],\"assetIds\":[],\"keywords\":[],\"order\":25,\"kind\":\"figure\"},{\"id\":\"su-zhe\",\"slug\":\"su-zhe\",\"title\":\"苏辙\",\"summary\":\"苏轼之弟，与兄长同有文学声名。\",\"body\":[\"《宋史》苏轼传提及弟辙；年谱载兄弟同科及第及各自仕宦遭际。苏辙在这里作为历史人物关联呈现，本期未将其建立为另一位可探索诗人。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"北宋\",\"start\":960,\"end\":1127,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"chronology\"],\"assetIds\":[],\"keywords\":[],\"order\":26,\"kind\":\"figure\"},{\"id\":\"northern-song\",\"slug\":\"northern-song\",\"title\":\"北宋\",\"summary\":\"苏轼一生所处的历史时期。\",\"body\":[\"北宋（960—1127）是苏轼活动的时代。嘉祐、熙宁、元丰、元祐、绍圣等年号反映他人生中的不同政治阶段。读他的作品，可以结合具体事件，避免把整个时代压成一种不变的背景。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"960—1127年\",\"start\":960,\"end\":1127,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"museum\"],\"assetIds\":[],\"keywords\":[],\"order\":27,\"kind\":\"period\"},{\"id\":\"red-cliffs\",\"slug\":\"red-cliffs\",\"title\":\"两个“赤壁”：史实与文学\",\"summary\":\"黄州的风景，不等于赤壁之战的战场。\",\"body\":[\"《念奴娇》是在黄州江岸展开怀古。它把眼前的山水与周瑜的历史形象联系起来；“人道是”本身就不是确定地点的证据。\",\"赤壁之战发生于208年（建安十三年）。《三国志》周瑜传叙述交战过程，但不能用词中的地点名称替代历史地理考证。黄州赤壁与赤壁之战的战场不能简单画等号；具体古战场的学术争论，本期不作唯一坐标的断言。\",\"因此，从词进入周瑜，应沿“文学引用”关系；从苏轼进入黄州，应沿“生活 / 游历”关系。相同名称可以连接阅读，却不能抹平关系性质。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"时间未详\",\"precision\":\"unknown\",\"calendar\":\"gregorian\",\"certainty\":\"unknown\",\"note\":\"本条为知识说明，未设单一发生日期。\"},\"sourceIds\":[\"nian-source\",\"zhou-source\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[\"赤壁\",\"历史赤壁\",\"文学赤壁\"],\"order\":28,\"kind\":\"background\"},{\"id\":\"chibi-battle\",\"slug\":\"chibi-battle\",\"title\":\"赤壁之战\",\"summary\":\"建安十三年，孙刘方面与曹军在赤壁交战。\",\"body\":[\"《三国志》周瑜传载建安十三年曹操入荆州，以及周瑜、程普与刘备方面合力抵御、黄盖提出火攻的过程。苏轼的词是后世文学追怀，不能作为此次战役的直接见闻。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"208年（建安十三年）\",\"start\":208,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"zhou-source\"],\"assetIds\":[],\"keywords\":[\"赤壁\",\"周瑜\"],\"order\":29,\"kind\":\"event\",\"background\":\"东汉末年，曹操南下，荆州局势变化。\",\"impact\":\"战争改变了此后势力发展的格局，也成为后世反复书写的历史题材。\"},{\"id\":\"huangzhou-years\",\"slug\":\"huangzhou-years\",\"title\":\"苏轼的黄州岁月\",\"summary\":\"沿四个章节，读一段从人生转折走向日常与文学的旅程。\",\"body\":[\"从乌台诗案、黄州生活，到雨中行路与赤壁怀古，再到承天寺的月色。章节随时可进入，思考随时可跳过。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1079—1084年\",\"start\":1079,\"end\":1084,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"ding-source\",\"nian-source\",\"night-source\"],\"assetIds\":[\"river-scene\"],\"keywords\":[],\"order\":30,\"kind\":\"topic\",\"minutes\":18},{\"id\":\"turning-point\",\"slug\":\"turning-point\",\"title\":\"01 · 转折：走向黄州\",\"summary\":\"乌台诗案改变了苏轼的处境。黄州是贬谪安置之地，先读事件，再理解后来作品中的风雨。\",\"body\":[\"乌台诗案改变了苏轼的处境。黄州是贬谪安置之地，先读事件，再理解后来作品中的风雨。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"黄州专题\",\"start\":1079,\"end\":1084,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"ding-source\",\"nian-source\",\"night-source\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[],\"order\":31,\"kind\":\"chapter\",\"topicId\":\"huangzhou-years\",\"question\":\"当文字卷入政治，生活怎样改变？\",\"contentIds\":[\"wutai\",\"arrival\",\"huangzhou-place\"]},{\"id\":\"daily-life\",\"slug\":\"daily-life\",\"title\":\"02 · 日常：东坡与春雨\",\"summary\":\"“东坡”既是躬耕生活的地点，也是逐渐为人熟知的别号。读《定风波》时，从小序中的真实遇雨出发，再思考风雨的文学意味。\",\"body\":[\"“东坡”既是躬耕生活的地点，也是逐渐为人熟知的别号。读《定风波》时，从小序中的真实遇雨出发，再思考风雨的文学意味。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"黄州专题\",\"start\":1079,\"end\":1084,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"ding-source\",\"nian-source\",\"night-source\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[],\"order\":32,\"kind\":\"chapter\",\"topicId\":\"huangzhou-years\",\"question\":\"耕作与行路，如何进入词的世界？\",\"contentIds\":[\"dongpo\",\"rain\",\"ding-feng-bo\"]},{\"id\":\"river-history\",\"slug\":\"river-history\",\"title\":\"03 · 江岸：两个赤壁\",\"summary\":\"《念奴娇》让周瑜来到读者眼前，却不等于苏轼见过周瑜，也不等于黄州赤壁就是战争现场。顺着不同性质的关联，分别阅读词、史书人物与地点辨析。\",\"body\":[\"《念奴娇》让周瑜来到读者眼前，却不等于苏轼见过周瑜，也不等于黄州赤壁就是战争现场。顺着不同性质的关联，分别阅读词、史书人物与地点辨析。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"黄州专题\",\"start\":1079,\"end\":1084,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"ding-source\",\"nian-source\",\"night-source\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[],\"order\":33,\"kind\":\"chapter\",\"topicId\":\"huangzhou-years\",\"question\":\"文学风景与历史现场相同吗？\",\"contentIds\":[\"red-cliff-writing\",\"nian-nu-jiao\",\"zhou-yu\",\"red-cliffs\"],\"reflection\":{\"question\":\"读到“人道是，三国周郎赤壁”，能否据此断定黄州赤壁是战争现场？\",\"explanation\":\"不能。文学中的传说语气不是地点考证。黄州赤壁是苏轼怀古的场所，战争史实与地点还需另看史料及历史地理研究。\"}},{\"id\":\"moonlight\",\"slug\":\"moonlight\",\"title\":\"04 · 月色：与友人同行\",\"summary\":\"承天寺夜游把一段短暂的日常写得清澈。我们可以欣赏月色，也可以联系贬谪处境理解“闲”；阐释可以丰富，但不应替作者补写真实言论。黄州之后，人生仍在继续。\",\"body\":[\"承天寺夜游把一段短暂的日常写得清澈。我们可以欣赏月色，也可以联系贬谪处境理解“闲”；阐释可以丰富，但不应替作者补写真实言论。黄州之后，人生仍在继续。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"黄州专题\",\"start\":1079,\"end\":1084,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不主张具体公历月日。\"},\"sourceIds\":[\"songshi\",\"ding-source\",\"nian-source\",\"night-source\",\"cliffs-source\"],\"assetIds\":[],\"keywords\":[],\"order\":34,\"kind\":\"chapter\",\"topicId\":\"huangzhou-years\",\"question\":\"“闲人”只有一种理解吗？\",\"contentIds\":[\"night-walk\",\"chengtian-night\",\"zhang-huai-min\",\"departure\"]},{\"id\":\"li-bai\",\"slug\":\"li-bai\",\"title\":\"李白\",\"summary\":\"把酒与月，写成天地间的自由。\",\"body\":[\"李白，字太白，号青莲居士。山川、远游与想象，在他的诗中汇成开阔而奔放的世界。\",\"读李白，可以从一个仰望的瞬间开始：月色是可以对饮的，瀑布仿佛从银河落下，即使行路艰难，目光仍投向远处的海。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"701—762\",\"start\":701,\"end\":762,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"li-bai-bio\",\"li-bai-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":40,\"kind\":\"poet\",\"aliases\":[\"李白\",\"太白\",\"青莲居士\",\"青蓮居士\"],\"dynasty\":\"唐\",\"courtesyName\":\"太白\",\"artName\":\"青莲居士\",\"contribution\":\"以鲜明的想象、自由的节奏与富于变化的语言，拓展唐诗的抒情天地。\",\"epigraph\":{\"lines\":[\"长风破浪会有时，\",\"直挂云帆济沧海。\"],\"title\":\"行路难·其一\",\"sourceId\":\"li-bai-verse\"}},{\"id\":\"wang-wei\",\"slug\":\"wang-wei\",\"title\":\"王维\",\"summary\":\"在山水的留白里，听见自己的心。\",\"body\":[\"王维，字摩诘，唐代诗人、画家。诗与画在他的创作中彼此映照，山林、流水与空寂的时刻，成为独特的风景。\",\"不妨跟随他的脚步慢下来。走到水流尽处，便坐下看云：诗中的静并不是空无，而是细小的声音、光线与人的心绪。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约701—761\",\"start\":701,\"end\":761,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"disputed\",\"note\":\"生年存在异说；此处采用故宫博物院条目所列701年并以约年展示。\"},\"sourceIds\":[\"wang-wei-bio\",\"wang-wei-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":41,\"kind\":\"poet\",\"aliases\":[\"王维\",\"王維\",\"摩诘\",\"摩詰\",\"王右丞\"],\"dynasty\":\"唐\",\"courtesyName\":\"摩诘\",\"artName\":\"未详\",\"contribution\":\"将山水观照与细腻感受融入诗歌，也以绘画参与唐代艺术。\",\"epigraph\":{\"lines\":[\"行到水穷处，\",\"坐看云起时。\"],\"title\":\"终南别业\",\"sourceId\":\"wang-wei-verse\"}},{\"id\":\"du-fu\",\"slug\":\"du-fu\",\"title\":\"杜甫\",\"summary\":\"一纸诗行，安放山河与人间。\",\"body\":[\"杜甫，字子美，唐代诗人。他把个人的漂泊、日常的困顿与时代的变动写在一起，让宏阔的历史有了具体的人的声音。\",\"从望岳时的昂扬，到风雨中的牵挂，读杜甫，也是在读一个人如何不断把目光投向他人。沉郁的句子里，始终有温热的心。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"712—770\",\"start\":712,\"end\":770,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"du-fu-bio\",\"du-fu-verse\"],\"assetIds\":[],\"keywords\":[\"唐诗\",\"诗人志\"],\"order\":42,\"kind\":\"poet\",\"aliases\":[\"杜甫\",\"子美\",\"少陵\",\"少陵野老\",\"杜工部\"],\"dynasty\":\"唐\",\"courtesyName\":\"子美\",\"artName\":\"未详\",\"contribution\":\"以深切的人间关怀与精密的诗歌语言，留下理解唐代社会与个人命运的重要作品。\",\"epigraph\":{\"lines\":[\"会当凌绝顶，\",\"一览众山小。\"],\"title\":\"望岳\",\"sourceId\":\"du-fu-verse\"}},{\"id\":\"li-qing-zhao\",\"slug\":\"li-qing-zhao\",\"title\":\"李清照\",\"summary\":\"将细微的心事，酿成时间的回声。\",\"body\":[\"李清照，号易安居士，生活于两宋之际。她以词书写日常与身世，也参与金石收藏、整理和写作。\",\"从溪亭日暮的忘归，到后来的漂泊与追忆，同样细腻的感受，承载了不同的人生重量。读她的词，可以先留意一个动作、一缕香气或一阵风。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1084—约1155\",\"start\":1084,\"end\":1155,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"disputed\",\"note\":\"卒年未定，国家典籍博物馆作1155？；此处保留约年。\"},\"sourceIds\":[\"li-qing-zhao-bio\",\"li-qing-zhao-verse\"],\"assetIds\":[],\"keywords\":[\"宋词\",\"诗人志\"],\"order\":43,\"kind\":\"poet\",\"aliases\":[\"李清照\",\"易安\",\"易安居士\"],\"dynasty\":\"两宋\",\"courtesyName\":\"未详\",\"artName\":\"易安居士\",\"contribution\":\"以清新而精细的语言表达复杂情感，形成辨识鲜明的词风；另有《金石录后序》等文章传世。\",\"epigraph\":{\"lines\":[\"常记溪亭日暮，\",\"沉醉不知归路。\"],\"title\":\"如梦令\",\"sourceId\":\"li-qing-zhao-verse\"}},{\"id\":\"xin-qi-ji\",\"slug\":\"xin-qi-ji\",\"title\":\"辛弃疾\",\"summary\":\"灯火与剑气，都照见一颗赤子之心。\",\"body\":[\"辛弃疾，字幼安，号稼轩，南宋词人。他的词既有壮怀与忧思，也写田园生活和细腻的情感。\",\"走进他的文字，不必只寻找金戈铁马。元夕的灯火、村居的闲适与夜深的回望，呈现出同一个人丰富而有力的内心。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1140—1207\",\"start\":1140,\"end\":1207,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"按年表示，不推断精确公历月日。\"},\"sourceIds\":[\"xin-qi-ji-bio\",\"xin-qi-ji-verse\"],\"assetIds\":[],\"keywords\":[\"宋词\",\"诗人志\"],\"order\":44,\"kind\":\"poet\",\"aliases\":[\"辛弃疾\",\"辛棄疾\",\"幼安\",\"稼轩\",\"稼軒\"],\"dynasty\":\"南宋\",\"courtesyName\":\"幼安\",\"artName\":\"稼轩\",\"contribution\":\"拓展词的题材与表达方式，将历史感、个人志向和日常情境纳入词中。\",\"epigraph\":{\"lines\":[\"众里寻他千百度。\"],\"title\":\"青玉案·元夕\",\"sourceId\":\"xin-qi-ji-verse\"}},{\"id\":\"ink-hangzhou\",\"slug\":\"ink-hangzhou\",\"title\":\"杭州·初任通判\",\"summary\":\"湖山晴雨，写在初任杭州的岁月里。\",\"body\":[\"这一篇章聚焦1071—1074年苏轼初任杭州通判期间的西湖作品。此时的职务与1089年以后再任杭州知州不同。\",\"晴雨湖面、望湖楼、荷风夜泛对应作品里的阅读意象。画面不使用后来修筑的苏堤来指代这一时期，也不声称还原北宋西湖的精确地貌。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1071—1074年，初任杭州通判\",\"start\":1071,\"end\":1074,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"按年表示，不推算具体公历月日。\"},\"sourceIds\":[\"ink-hangzhou-history\"],\"assetIds\":[],\"keywords\":[\"杭州\",\"苏轼\"],\"order\":110,\"kind\":\"place\",\"modernName\":\"浙江杭州\"},{\"id\":\"ink-mizhou\",\"slug\":\"ink-mizhou\",\"title\":\"密州·登临望月\",\"summary\":\"从平冈出猎，到超然台上的春色与中秋明月。\",\"body\":[\"苏轼于1074年由杭州移知密州，治所在今山东诸城一带，在此任职至1076年。\",\"《超然台记》写他由钱塘移守胶西、修补旧台，并记弟弟苏辙为台命名。出猎、登临和中秋怀人是本篇章的三条阅读线索，不代表同一天发生的行程。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1074—1076年，知密州\",\"start\":1074,\"end\":1076,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"按年表示，不推算具体公历月日。\"},\"sourceIds\":[\"chronology\",\"ink-chaoran-history\"],\"assetIds\":[],\"keywords\":[\"密州\",\"苏轼\"],\"order\":111,\"kind\":\"place\",\"modernName\":\"山东诸城一带\"},{\"id\":\"yin-hu-shang\",\"slug\":\"yin-hu-shang\",\"title\":\"饮湖上初晴后雨·其二\",\"summary\":\"晴日的水光与雨中的山色各有风致，诗人把两种景象都收入眼底。\",\"body\":[\"作品收入初任杭州篇章。诗题及正文写西湖饮游时的晴雨，不据此补写同行者、具体航线或苏堤景观。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1073年，初任杭州期间\",\"start\":1073,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"采用通行系年；题目只记晴雨变化，不记具体月日。\"},\"sourceIds\":[\"ink-yin-source\",\"ink-hangzhou-history\",\"ink-yin-date\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"杭州\",\"诗\"],\"order\":120,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"hangzhou-first-service\",\"genre\":\"诗\",\"original\":[\"水光潋滟晴方好，山色空濛雨亦奇。\",\"欲把西湖比西子，淡妆浓抹总相宜。\"],\"preface\":\"\",\"editionNote\":\"维基文库 oldid=1748111；繁体转简体，按原标点合为两联\",\"annotations\":[{\"term\":\"潋滟\",\"meaning\":\"水面波光闪动的样子。\"},{\"term\":\"空濛\",\"meaning\":\"烟雨朦胧、若有若无的样子；按本版保留“濛”字。\"},{\"term\":\"西子\",\"meaning\":\"西施，古代文学中常被用来比拟美好容貌的人物。\"}],\"interpretation\":[\"晴日的水光与雨中的山色各有风致，诗人把两种景象都收入眼底。\",\"以西施作比，淡妆浓抹都相宜，也就让晴与雨不再是美与不美的对立。\"],\"appreciation\":[\"前联写眼前景色，后联以一个比喻把湖山的多种面貌收拢起来。短诗的转折不是排斥雨景，而是扩展观看西湖的方式。\"],\"background\":\"作品收入初任杭州篇章。诗题及正文写西湖饮游时的晴雨，不据此补写同行者、具体航线或苏堤景观。\"},{\"id\":\"wang-hu-lou-one\",\"slug\":\"wang-hu-lou-one\",\"title\":\"六月二十七日望湖楼醉书·其一\",\"summary\":\"乌云尚未遮住山，急雨已经像跳珠般落进船里。\",\"body\":[\"诗题记望湖楼醉书。画中的楼阁与雨幕取自诗意，不作为楼阁尺寸、结构或作者当日移动位置的史料。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1072年，农历六月二十七日\",\"start\":1072,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"approximate\",\"note\":\"月日据诗题，年采用通行系年；不将农历六月二十七日写成公历6月27日。\"},\"sourceIds\":[\"ink-wanghu-source\",\"ink-hangzhou-history\",\"ink-wanghu-date\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"杭州\",\"诗\"],\"order\":121,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"hangzhou-first-service\",\"genre\":\"诗\",\"original\":[\"黑云翻墨未遮山，白雨跳珠乱入船。\",\"卷地风来忽吹散，望湖楼下水如天。\"],\"preface\":\"\",\"editionNote\":\"维基文库 oldid=2007479；繁体转简体，“飜”规范为“翻”\",\"annotations\":[{\"term\":\"翻墨\",\"meaning\":\"像泼翻的墨汁，形容迅速聚集的浓黑云层。\"},{\"term\":\"跳珠\",\"meaning\":\"跳动的珠子，用来写骤雨落入船中的样子。\"},{\"term\":\"水如天\",\"meaning\":\"雨散以后，开阔水面与天空相映的景象。\"}],\"interpretation\":[\"乌云尚未遮住山，急雨已经像跳珠般落进船里。\",\"一阵风卷散雨云，楼下水面重新显得明净开阔。\"],\"appreciation\":[\"“未”“乱”“忽”把天气变化写得紧凑，黑云与白雨的颜色相对，最后以水天开阔收束。作品是组诗中的完整第一首。\"],\"background\":\"诗题记望湖楼醉书。画中的楼阁与雨幕取自诗意，不作为楼阁尺寸、结构或作者当日移动位置的史料。\"},{\"id\":\"ye-fan-xi-hu-four\",\"slug\":\"ye-fan-xi-hu-four\",\"title\":\"夜泛西湖五绝·其四\",\"summary\":\"夜色里水草连成一片，荷花的香气随着风露浮来。\",\"body\":[\"本章收录五首组诗中的第四首完整正文，作为夜泛西湖的阅读停靠点。远寺不具体指认为某座现存寺庙，湖光的成因也不作科学断言。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1071—1074年，初任杭州期间\",\"start\":1071,\"end\":1074,\"precision\":\"range\",\"calendar\":\"gregorian\",\"certainty\":\"approximate\",\"note\":\"按编年诗收录与杭州任职背景归入本章；所用正文不载确切日期，不将月色反推为具体夜晚。\"},\"sourceIds\":[\"ink-yefan-source\",\"ink-night-date\",\"ink-hangzhou-history\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"杭州\",\"诗\"],\"order\":122,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"hangzhou-first-service\",\"genre\":\"诗\",\"original\":[\"菇蒲无边水茫茫，荷花夜开风露香。\",\"渐见灯明出远寺，更待月黑看湖光。\"],\"preface\":\"\",\"editionNote\":\"维基文库 oldid=1542711；繁体转简体，保留“菇蒲”\",\"annotations\":[{\"term\":\"菇蒲\",\"meaning\":\"水边生长的菇、蒲一类植物；保留所据版本写法。\"},{\"term\":\"风露香\",\"meaning\":\"夜风与露气中传来的荷花香气。\"},{\"term\":\"月黑\",\"meaning\":\"月光隐去或不足以照亮湖面的时刻。\"}],\"interpretation\":[\"夜色里水草连成一片，荷花的香气随着风露浮来。\",\"远寺灯火渐渐显出，诗人还要等月光退去，继续观看湖面的光影。\"],\"appreciation\":[\"由植物和荷香移向远灯与湖光，诗的观看顺序也从身边推向远处。夜晚的细微感受与骤雨诗的急促节奏形成对照。\"],\"background\":\"本章收录五首组诗中的第四首完整正文，作为夜泛西湖的阅读停靠点。远寺不具体指认为某座现存寺庙，湖光的成因也不作科学断言。\"},{\"id\":\"jiang-cheng-zi-hunt\",\"slug\":\"jiang-cheng-zi-hunt\",\"title\":\"江城子·密州出猎\",\"summary\":\"词人以出猎时的犬、鹰、骑队和装束铺开气势，借古人典故写自己的豪情。\",\"body\":[\"作品作于知密州时期。画中平冈、疏林与远山对应词里的出猎意象，行舟是统一阅读交互，不表示作者乘船出猎。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1075年，熙宁八年\",\"start\":1075,\"precision\":\"year\",\"calendar\":\"gregorian\",\"certainty\":\"confirmed\",\"note\":\"年据所选文本题署；词正文不载具体月日。\"},\"sourceIds\":[\"ink-hunt-source\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"密州\",\"词\"],\"order\":123,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"mizhou-service\",\"genre\":\"词\",\"original\":[\"老夫聊发少年狂，左牵黄，右擎苍。\",\"锦帽貂裘，千骑卷平冈。\",\"为报倾城随太守，亲射虎，看孙郎。\",\"酒酣胸胆尚开张，鬓微霜，又何妨。\",\"持节云中，何日遣冯唐。\",\"会挽雕弓如满月，西北望，射天狼。\"],\"preface\":\"\",\"editionNote\":\"维基文库 oldid=9252125；繁体转简体，保留原标点\",\"annotations\":[{\"term\":\"黄 / 苍\",\"meaning\":\"“黄”指黄犬，“苍”指苍鹰，都是出猎的意象。\"},{\"term\":\"孙郎\",\"meaning\":\"这里借孙权射虎的典故写出猎气概。\"},{\"term\":\"冯唐\",\"meaning\":\"汉代人物；词中借持节赦魏尚的故事，寄寓被朝廷重新信任的愿望。\"},{\"term\":\"天狼\",\"meaning\":\"星名；在本词中承载对敌与报国的象征意味，不是对真实狼群的描写。\"}],\"interpretation\":[\"词人以出猎时的犬、鹰、骑队和装束铺开气势，借古人典故写自己的豪情。\",\"下片从鬓发微白转向仍有壮志的自我表达，以弯弓望向西北作结。\"],\"appreciation\":[\"出猎的动作场面与自我期许相互映照。孙权、冯唐等典故把个人年龄和处境放进更广的历史想象，不能据词中夸饰重建真实出猎规模。\"],\"background\":\"作品作于知密州时期。画中平冈、疏林与远山对应词里的出猎意象，行舟是统一阅读交互，不表示作者乘船出猎。\"},{\"id\":\"wang-jiang-nan\",\"slug\":\"wang-jiang-nan\",\"title\":\"望江南·超然台作\",\"summary\":\"春天还未过去，细风斜柳、半壕春水和满城花色，在登台远望中展开。\",\"body\":[\"此词与《超然台记》共同构成密州登临的阅读背景。台上视野由文本提供意象，画面不复刻当代重建景区的建筑样式。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"约1076年暮春，寒食后\",\"start\":1076,\"precision\":\"year\",\"calendar\":\"mixed\",\"certainty\":\"approximate\",\"note\":\"季节与寒食后据词文，年采用通行系年；不精确换算节日公历日期。\"},\"sourceIds\":[\"ink-wangjiang-source\",\"ink-chaoran-history\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"密州\",\"词\"],\"order\":124,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"mizhou-service\",\"genre\":\"词\",\"original\":[\"春未老，风细柳斜斜。\",\"试上超然台上看，半壕春水一城花。\",\"烟雨暗千家。\",\"寒食后，酒醒却咨嗟。\",\"休对故人思故国，且将新火试新茶。\",\"诗酒趁年华。\"],\"preface\":\"\",\"editionNote\":\"维基文库 oldid=2589938《望江南（春未老）》；繁体转简体，按句号分行\",\"annotations\":[{\"term\":\"超然台\",\"meaning\":\"苏轼在密州修葺的旧台，苏辙为之命名；相关自述见《超然台记》。\"},{\"term\":\"咨嗟\",\"meaning\":\"叹息的声音。\"},{\"term\":\"新火 / 新茶\",\"meaning\":\"寒食之后重新取火，与春日新茶相连，写可把握的当下生活。\"}],\"interpretation\":[\"春天还未过去，细风斜柳、半壕春水和满城花色，在登台远望中展开。\",\"酒醒后的乡思尚在，词人转而提醒自己试新茶、惜年华。\"],\"appreciation\":[\"上片以一城春色铺陈视野，下片把远眺引向思乡，又用“且将”转回眼前可享的日常。这里的超然包含情绪转折，并非从未有过忧思。\"],\"background\":\"此词与《超然台记》共同构成密州登临的阅读背景。台上视野由文本提供意象，画面不复刻当代重建景区的建筑样式。\"},{\"id\":\"shui-diao-ge-tou\",\"slug\":\"shui-diao-ge-tou\",\"title\":\"水调歌头·明月几时有\",\"summary\":\"举杯问月，想象天上的宫阙，却又回到有舞影相伴的人间。\",\"body\":[\"此词写于密州任内的丙辰中秋。月亮与楼阁作为作品意象单独设计；现有材料不足以把这一夜的写作位置精确指认为超然台。\"],\"status\":\"published\",\"certainty\":\"documented\",\"date\":{\"label\":\"1076年，丙辰中秋\",\"start\":1076,\"precision\":\"day\",\"calendar\":\"mixed\",\"certainty\":\"confirmed\",\"note\":\"年节据小序“丙辰中秋”；不采用网页自动换算的公历月日，也不把创作点具体定位到超然台。\"},\"sourceIds\":[\"ink-shuidiao-source\",\"chronology\"],\"assetIds\":[],\"keywords\":[\"苏轼\",\"密州\",\"词\"],\"order\":125,\"kind\":\"work\",\"poetId\":\"su-shi\",\"stageId\":\"service\",\"eventId\":\"mizhou-service\",\"genre\":\"词\",\"original\":[\"明月几时有，把酒问青天。\",\"不知天上宫阙，今夕是何年。\",\"我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\",\"起舞弄清影，何似在人间。\",\"转朱阁，低绮户，照无眠。\",\"不应有恨，何事长向别时圆。\",\"人有悲欢离合，月有阴晴圆缺，此事古难全。\",\"但愿人长久，千里共婵娟。\"],\"preface\":\"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\",\"editionNote\":\"斯坦福 Global Medieval Sourcebook，底本唐圭璋编《全宋词》第一册第279页；繁体转简体\",\"annotations\":[{\"term\":\"子由\",\"meaning\":\"苏辙的字；小序说明此词兼怀弟弟。\"},{\"term\":\"琼楼玉宇\",\"meaning\":\"以美玉形容的天上楼宇，属于词中的想象。\"},{\"term\":\"绮户\",\"meaning\":\"有花纹装饰的门窗。\"},{\"term\":\"婵娟\",\"meaning\":\"此处指明月的美好姿态，借共望明月寄托相隔两地的祝愿。\"}],\"interpretation\":[\"举杯问月，想象天上的宫阙，却又回到有舞影相伴的人间。\",\"下片把人的聚散与月亮的圆缺相照，最后把难以团聚的惆怅转成彼此长久安好的愿望。\"],\"appreciation\":[\"上片在天上与人间之间来回，下片在圆满与缺憾之间展开思考。小序中的怀弟让宏阔的想象始终牵连着具体的亲情。\"],\"background\":\"此词写于密州任内的丙辰中秋。月亮与楼阁作为作品意象单独设计；现有材料不足以把这一夜的写作位置精确指认为超然台。\"}],\"relations\":[{\"id\":\"r-1\",\"from\":\"su-shi\",\"to\":\"exam\",\"type\":\"participated\",\"reason\":\"苏轼经历：嘉祐二年进士及第。\",\"certainty\":\"documented\",\"sourceIds\":[\"songshi\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-2\",\"from\":\"su-shi\",\"to\":\"xuzhou-flood\",\"type\":\"participated\",\"reason\":\"苏轼经历：徐州守城抗洪。\",\"certainty\":\"documented\",\"sourceIds\":[\"songshi\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-3\",\"from\":\"su-shi\",\"to\":\"wutai\",\"type\":\"participated\",\"reason\":\"苏轼经历：乌台诗案。\",\"certainty\":\"documented\",\"sourceIds\":[\"songshi\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-4\",\"from\":\"su-shi\",\"to\":\"arrival\",\"type\":\"participated\",\"reason\":\"苏轼经历：抵达黄州。\",\"certainty\":\"documented\",\"sourceIds\":[\"songshi\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-5\",\"from\":\"su-shi\",\"to\":\"dongpo\",\"type\":\"participated\",\"reason\":\"苏轼经历：躬耕东坡。\",\"certainty\":\"documented\",\"sourceIds\":[\"songshi\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-6\",\"from\":\"su-shi\",\"to\":\"rain\",\"type\":\"participated\",\"reason\":\"苏轼经历：沙湖道中遇雨。\",\"certainty\":\"documented\",\"sourceIds\":[\"ding-source\",\"chronology\"],\"status\":\"published\"},{\"id\":\"r-7\",\"from\":\"su-shi\",\"to\":\"red-cliff-writing\",\"type\":\"participated\",\"reason\":\"苏轼经历：赤壁怀古与文学创作。\",\"certainty\":\"documented\",\"sourceIds\":[\"nian-source\",\"c
